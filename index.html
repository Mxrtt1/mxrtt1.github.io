<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoşgeldin Kardeşim.</title>
    <style>
        /* 1. ATATÜRK ARKA PLAN RESMİ AYARI */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            /* Kaliteli, siyah-beyaz bir Atatürk görseli eklenmiştir */
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('https://unsplash.com') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            overflow: hidden;
        }

        h1 {
            font-size: 3rem;
            text-shadow: 0px 4px 15px rgba(0,0,0,0.9);
            margin-bottom: 20px;
            user-select: none;
        }

        /* SAĞ ALTTAKİ KONTROL PANELİ (MÜZİK VE DISCORD) */
        #controls-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 15px;
            z-index: 9999;
        }

        /* YENİ GELİŞMİŞ MÜZİK ÇALAR TASARIMI */
        #music-player {
            background-color: rgba(32, 34, 37, 0.95); /* Discord koyu teması */
            padding: 12px 18px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Oynat / Durdur Simgesi Butonu */
        #music-btn {
            background: #2ed573;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        #music-btn:hover {
            transform: scale(1.1);
        }

        /* Süre Ayarlama Çubuğu (Slider) */
        #seek-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 130px;
            height: 5px;
            border-radius: 5px;
            background: #4f545c;
            outline: none;
            cursor: pointer;
            transition: background 0.2s;
        }
        #seek-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
        #seek-slider::-moz-range-thumb {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }

        /* Zaman Metni */
        #time-display {
            font-size: 0.85rem;
            font-family: monospace;
            color: #b9bbbe;
            min-width: 35px;
            text-align: center;
        }

        /* DISCORD BUTONU TASARIMI */
        #discord-btn {
            background-color: #5865F2;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 25px rgba(88, 101, 242, 0.4);
            transition: all 0.3s ease;
            text-decoration: none;
        }
        #discord-btn:hover {
            transform: scale(1.1) rotate(10deg);
            box-shadow: 0 12px 30px rgba(88, 101, 242, 0.7);
        }
        #discord-btn svg {
            width: 30px;
            height: 30px;
            fill: white;
        }
    </style>
</head>
<body>

    <h1>Hoş Geldin Kardeşim.</h1>

    <!-- Ses Dosyası -->
    <audio id="bg-music" loop>
        <source src="nesetertas.mp3" type="audio/mpeg">
    </audio>

    <!-- Sağ Alttaki Birleşik Panel -->
    <div id="controls-container">
        
        <!-- Gelişmiş Müzik Çalar -->
        <div id="music-player">
            <button id="music-btn" onclick="toggleMusic()">▶</button>
            <input type="range" id="seek-slider" value="0" min="0" max="100" oninput="seekMusic()">
            <span id="time-display">0:00</span>
        </div>

        <!-- Discord Butonu (Buraya kendi davet linkinizi yazmayı unutmayın) -->
        <a href="https://discord.gg/gangboys" target="_blank" id="discord-btn" title="Discord Sunucumuza Katıl!">
            <svg viewBox="0 0 127.14 96.36">
                <path d="M107.7,8.07A105.15,105.15,0,0,0,77.26,0a77.19,77.19,0,0,0-3.3,6.83A96.67,96.67,0,0,0,53.22,6.83,77.19,77.19,0,0,0,49.88,0,105.15,105.15,0,0,0,19.44,8.07C3.66,31.58-1.86,54.65,1,77.53A105.73,105.73,0,0,0,32,96.36a77.7,77.7,0,0,0,6.63-10.85,68.43,68.43,0,0,1-10.5-5c.79-.58,1.57-1.19,2.31-1.82a74.37,74.37,0,0,0,73.4,0c.75.63,1.53,1.24,2.32,1.82a68.52,68.52,0,0,1-10.5,5,78.37,78.37,0,0,0,6.63,10.85,105.47,105.47,0,0,0,31.6-18.83C129.87,48.51,123.63,25.7,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53S36.18,40.36,42.45,40.36,53.83,46,53.83,53,48.72,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.24,60,73.24,53S78.41,40.36,84.69,40.36,96.07,46,96.07,53,91,65.69,84.69,65.69Z"/>
            </svg>
        </a>

    </div>

    <script>
        var music = document.getElementById("bg-music");
        var btn = document.getElementById("music-btn");
        var slider = document.getElementById("seek-slider");
        var timeDisplay = document.getElementById("time-display");

        // Müziği Başlat / Durdur (Yalnızca Simge)
        function toggleMusic() {
            if (music.paused) {
                music.play();
                btn.innerHTML = "⏸";
                btn.style.backgroundColor = "#ff4757"; // Çalarken durdurma simgesi ve kırmızı renk
            } else {
                music.pause();
                btn.innerHTML = "▶";
                btn.style.backgroundColor = "#2ed573"; // Dururken oynatma simgesi ve yeşil renk
            }
        }

        // Müzik çaldıkça zaman çubuğunu ve dakikayı güncelle
        music.ontimeupdate = function() {
            if (!isNaN(music.duration)) {
                var value = (music.currentTime / music.duration) * 100;
                slider.value = value;
                
                // Dakika:Saniye Formatı hesaplama
                var mins = Math.floor(music.currentTime / 60);
                var secs = Math.floor(music.currentTime % 60);
                if (secs < 10) secs = '0' + secs;
                timeDisplay.innerHTML = mins + ':' + secs;
            }
        };

        // Kullanıcı çubuğu kaydırdığında müziğin süresini ayarla
        function seekMusic() {
            if (!isNaN(music.duration)) {
                var time = music.duration * (slider.value / 100);
                music.currentTime = time;
            }
        }

        // Müzik dosyası yüklendiğinde slider'ın maksimum değerini ayarla
        music.onloadedmetadata = function() {
            slider.max = 100;
        };
    </script>
</body>
</html>
